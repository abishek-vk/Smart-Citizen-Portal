        receiptNumber:
          type: string
        status:
          type: string
          enum: [success, failed, pending, refunded]
        paidAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, userId, type, referenceId, amount, paymentMethod, receiptNumber, status, createdAt]

